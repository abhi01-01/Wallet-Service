name: Wallet Service CI/CD pipeline

# Trigger the pipeline only on pushes to the production branch
on:
  push:
    branches:
      - production

# Define environment variables used across stages
env:
  DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: wallet-service
  # Forces all actions to execute on the Node 24 runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-publish-deploy:
    name: Build Test Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout the code onto the CI runner (the ephemeral server)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Stage 2: Provision the Runtime Environment
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven    # Caches dependencies to speed up future pipeline runs

      # Stage 3: Static Analysis & Testing
      - name: Run Maven Tests
        run: mvn test

      # Stage 4: Compile and Package the Artifact (.jar)
      - name: Build Application (.jar)
        run: mvn clean package -DskipTests

      # Stage 5: Authenticate with the Artifact Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # Stage 6: Containerization (Build Docker Image)
      # Uses the exact Dockerfile uploaded
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # Stage 7: Push to Registry
      # The built image is stored remotely so the production server can pull it
      - name: Push Image to Docker Hub
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # Stage 8: Continuous Deployment (Trigger Target)
      # Notifies the server to pull the new 'latest' image and restart
      - name: Trigger Production Deployment
        run: |
          curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}    
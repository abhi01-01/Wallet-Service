logging:
  level:
    root: INFO
    com.wallet.walletservice: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
  lifecycle:
    timeout-per-shutdown-phase: 30s # Allows the webhook strategy 30s to finish processing
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  shutdown: graceful

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

management:
  endpoints:
    web:
      # 1. Relocate the base path to a cryptographically obscure shared secret string
      base-path: /${ACTUATOR_OBSCURE_PATH:internal-probe-849284}
      exposure:
        # Expose only probe and scrape endpoints. Keep env, beans, mappings, etc. closed.
        include: health,prometheus
  endpoint:
    health:
      # 3. Suppress all component details globally (hides DB state, disk space, Redis details)
      show-details: never

  # Asynchronous OTLP Push Telemetry
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_GRAFANA_URL:}
        step: 15s # Metrics aggregation and transmission interval
        headers:
          Authorization: ${OTLP_GRAFANA_AUTH_HEADER:}

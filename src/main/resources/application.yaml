spring:
  application:
    name: WalletService
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME}
      auto-commit: ${DB_POOL_AUTO_COMMIT}
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS}
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          fetch_size: ${HIBERNATE_JDBC_FETCH_SIZE}
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      client-id: wallet-service-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
    consumer:
      group-id: ${WALLET_KAFKA_CONSUMER_GROUP_ID:wallet-service-audit-consumer}
      client-id: ${WALLET_KAFKA_CONSUMER_CLIENT_ID:wallet-service-audit-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: ${WALLET_KAFKA_MAX_POLL_RECORDS:50}
server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_ACCESS}          # 5 minutes (Short-lived Access Token)
  refresh-expiration-ms: ${JWT_EXPIRATION_REFRESH}    # 7 days (Long-lived Refresh Token)

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.wallet.walletservice: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
  # Open telemetry logging pattern
#  pattern:
#    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
#  include-application-name: false

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}

wallet:
  security:
    authorized-system-ids: ${AUTHORIZED_SYSTEM_IDS:}
  kafka:
    enabled: ${WALLET_KAFKA_ENABLED:true}
    topics:
      wallet-transaction-events: ${WALLET_TRANSACTION_EVENTS_TOPIC:wallet.transaction.events.v1}
    topic-settings:
      partitions: ${WALLET_KAFKA_TOPIC_PARTITIONS:3}
      min-in-sync-replicas: ${WALLET_KAFKA_MIN_IN_SYNC_REPLICAS:1}
      replicas: ${WALLET_KAFKA_TOPIC_REPLICAS:1}
      retention-ms: ${WALLET_KAFKA_TOPIC_RETENTION_MS:604800000}
      cleanup-policy: ${WALLET_KAFKA_TOPIC_CLEANUP_POLICY:delete}
    consumer:
      audit-enabled: ${WALLET_KAFKA_AUDIT_CONSUMER_ENABLED:true}
      concurrency: ${WALLET_KAFKA_CONSUMER_CONCURRENCY:1}
      retry-interval-ms: ${WALLET_KAFKA_CONSUMER_RETRY_INTERVAL_MS:1000}
      retry-max-attempts: ${WALLET_KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:3}
  outbox:
    publisher:
      enabled: ${WALLET_OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${WALLET_OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${WALLET_OUTBOX_FIXED_DELAY_MS:2000}
      max-attempts: ${WALLET_OUTBOX_MAX_ATTEMPTS:5}
      retry-delay-ms: ${WALLET_OUTBOX_RETRY_DELAY_MS:60000}
      stale-lock-timeout-ms: ${WALLET_OUTBOX_STALE_LOCK_TIMEOUT_MS:120000}

brevo:
  api:
    key: ${BREVO_API_KEY}
    sender-email: ${BREVO_SENDER_EMAIL}
    sender-name: ${MAIL_SENDER_NAME}

management:
  endpoints:
    web:
      base-path: /actuator # Inherited by default and test profiles automatically
      exposure:
        # Expose prometheus alongside your existing openapi whitelist
        include: health,info,openapi,swagger-ui,prometheus
  endpoint:
    prometheus:
      access: unrestricted
    health:
      probes:
        enabled: true
      show-details: always

  # Metric Multi-Dimensional Tagging
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # CRITICAL: Forces Tomcat to calculate precise latency percentiles (p95, p99)
        http:
          server:
            requests: true

  # Distributed Tracing Configuration
  tracing:
    sampling:
      probability: 1.0 # 100% trace sampling for Phase 1 development

  otlp:
    metrics:
      export:
        enabled: false    # CRITICAL: Disables OTLP metrics. We strictly use Prometheus for this.
